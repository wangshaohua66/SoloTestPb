id: example_post_request
name: POST请求示例
description: 测试POST请求和JSON数据
tags:
  - smoke
  - post
module: httpbin
variables:
  base_url: https://httpbin.org
  random_name: ${name()}
  random_email: ${email()}

request:
  method: POST
  url: ${base_url}/post
  json:
    name: ${random_name}
    email: ${random_email}
    age: ${random_int(18, 60)}
    active: true
  headers:
    Content-Type: application/json

assertions:
  - type: status_code
    expected: 200

  - type: json_path
    path: json.name
    expected: ${random_name}

  - type: json_path
    path: json.active
    expected: true

  - type: type
    key: json.age
    expected: int
