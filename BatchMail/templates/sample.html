<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #4a90d9;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }
        .content {
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 5px;
            margin-top: 20px;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>欢迎加入我们</h1>
    </div>
    <div class="content">
        <p>亲爱的 {{ name if name else '用户' }}：</p>
        <p>您好！感谢您订阅我们的服务。</p>
        {% if company %}
        <p>您所在的公司是：<strong>{{ company }}</strong></p>
        {% endif %}
        {% if discount_code %}
        <p>您的专属优惠码是：<strong style="color: #e74c3c;">{{ discount_code }}</strong></p>
        {% endif %}
        <p>如果您有任何问题，请随时回复此邮件与我们联系。</p>
        <p>祝您生活愉快！</p>
    </div>
    <div class="footer">
        <p>此邮件由系统自动发送，请勿直接回复。</p>
    </div>
</body>
</html>
